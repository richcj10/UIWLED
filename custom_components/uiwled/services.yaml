set_port:
  name: Set port color
  description: Pin a single jack on a UIWLED switch to an RGB color, overriding the running effect.
  fields:
    switch:
      name: Switch
      description: Name of the switch as configured in the addon.
      required: true
      example: rack_top
      selector:
        text:
    port:
      name: Port
      description: 1-based physical port number on the switch.
      required: true
      example: 5
      selector:
        number:
          min: 1
          max: 1024
          mode: box
    rgb_color:
      name: RGB color
      description: "[R, G, B] each 0-255."
      required: true
      example: "[255, 0, 128]"
      selector:
        object:
    duration_ms:
      name: Duration (ms)
      description: How long the override should last. 0 = until cleared.
      default: 0
      selector:
        number:
          min: 0
          max: 86400000
          mode: box

clear_port:
  name: Clear port override
  description: Remove a single per-jack override on a UIWLED switch.
  fields:
    switch:
      name: Switch
      required: true
      selector:
        text:
    port:
      name: Port
      required: true
      selector:
        number:
          min: 1
          max: 1024
          mode: box

clear_all_ports:
  name: Clear all port overrides
  description: Remove every per-jack override on a UIWLED switch.
  fields:
    switch:
      name: Switch
      required: true
      selector:
        text:
